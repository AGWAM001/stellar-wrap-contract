[package]
name = "stellar_wrap_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
